# Implantação de referência em um servidor com Docker. NÃO executar em produção sem autorização.
# Uso: cp deploy/env.prod.example deploy/.env.prod (preencher) && \
#      docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Para usar PostgreSQL gerenciado (ex.: Supabase), remova o serviço "db" e aponte DATABASE_URL para ele.
name: noxora
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: noxora
      POSTGRES_USER: noxora_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?defina}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina}
    volumes: [pgdata:/var/lib/postgresql/data, ./db-init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noxora_owner -d noxora"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  migrate:
    build: ../backend
    image: noxora-backend
    env_file: .env.prod
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?defina}
    secrets: [biometric_keys]
    command: ["sh", "-c", "python manage.py preflight && python manage.py migrate --noinput && python manage.py check --deploy --fail-level ERROR"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  backend:
    build: ../backend
    image: noxora-backend
    env_file: .env.prod
    secrets: [biometric_keys]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped

  worker:
    build: ../backend
    image: noxora-backend
    env_file: .env.prod
    command: ["python", "manage.py", "run_worker"]
    secrets: [biometric_keys]
    healthcheck:
      disable: true
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  edge:
    build: ../frontend
    image: noxora-edge
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data]
    depends_on: [backend]
    restart: unless-stopped

secrets:
  biometric_keys:
    file: ${BIOMETRIC_KEYS_HOST_FILE:-./secrets/biometric_keys.json}

volumes:
  pgdata:
  caddy_data:
