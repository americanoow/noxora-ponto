services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: noxora
      POSTGRES_USER: noxora
      POSTGRES_PASSWORD: noxora_dev # somente desenvolvimento local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noxora -d noxora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
